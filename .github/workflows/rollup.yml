name: 오늘 함께 집계

# 두 시간마다 오늘치를 세어 index.html 에 숫자를 박는다.
# 하루 한 번이면 누르고 하루를 넘게 기다려야 보였다. 숫자가 안 바뀌면 커밋도 안 하므로
# 사람이 적을 때는 커밋이 거의 안 생긴다.
on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: '집계할 날짜 (YYYY-MM-DD, 비우면 어제)'
        required: false

permissions:
  contents: write

concurrency:
  group: rollup
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 집계
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ROLLUP_DAY: ${{ inputs.day }}
        run: node .github/scripts/rollup.mjs

      - name: 바뀌었으면 올린다
        run: |
          if git diff --quiet -- index.html; then
            echo "바뀐 것 없음"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "chore: 오늘 함께 집계 갱신"
          git push
